<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WMS Alicorp · Picking y lotes</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section id="login">
 <div class="lg-wrap">
  <aside class="lg-hero">
   <div class="lg-logo">A</div>
   <h1>WMS Alicorp</h1>
   <div class="lg-bars" aria-hidden="true"></div>
  </aside>
  <form class="lg-form" id="lf" onsubmit="return false">
   <h2>Iniciar sesión</h2>
   <p class="lg-sub">Ingresa con tu correo de la empresa.</p>
   <label for="u">Correo electrónico</label>
   <div class="lg-field">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
    <input id="u" type="email" autocomplete="username" placeholder="nombre@empresa.com">
   </div>
   <label for="p">Contraseña</label>
   <div class="lg-field">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <input id="p" type="password" autocomplete="current-password" placeholder="Tu contraseña">
   </div>
   <label class="chk"><input type="checkbox" id="sp">Mostrar contraseña</label>
   <div class="err" id="le" role="alert"></div>
   <button class="btn full" id="lb">Ingresar</button>
  </form>
 </div>
</section>

<div id="app" class="hidden">
 <nav id="nav" aria-label="Secciones"></nav>
 <main id="main"></main>
</div>
<div id="toast" class="hidden" role="status"></div>

<script src="app.js"></script>
</body>
</html>
