<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WMS Alicorp · Picking y lotes</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section id="login">
 <form class="lbox" id="lf" onsubmit="return false">
  <div class="logo"><i>A</i><h1>WMS Alicorp</h1></div>
  <p style="color:var(--mute);margin:0">Picking y control de lotes. Inicia sesión para continuar.</p>
  <label for="u">Correo electrónico</label><input id="u" type="email" autocomplete="username" placeholder="nombre@alicorp.demo">
  <label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password">
  <div class="err" id="le" role="alert"></div>
  <button class="btn full" id="lb">Ingresar</button>
  <div class="demo">Cuentas de prueba:<br><b>Operario:</b> operario@alicorp.demo / Operario#2026<br><b>Supervisor:</b> supervisor@alicorp.demo / Supervisor#2026</div>
 </form>
</section>

<div id="app" class="hidden">
 <nav id="nav" aria-label="Secciones"></nav>
 <main id="main"></main>
</div>
<div id="toast" class="hidden" role="status"></div>

<script src="app.js"></script>
</body>
</html>
